@if (isSpinnerVisible) {
<div id="http-loader">
  <div class="loader-bg">
    @switch (spinner) {
    @case (Spinkit.skLine) {
    <div class="sk-line-material spinnerx" >
      <div class="sk-child sk-bounce1 spinnerx" ></div>
    </div>
    }
    @case (Spinkit.skCubeGrid) {
    <div class="sk-cube-grid center">
      <div class="sk-cube sk-cube1 spinnerx"></div>
      <div class="sk-cube sk-cube2 spinnerx"></div>
      <div class="sk-cube sk-cube3 spinnerx"></div>
      <div class="sk-cube sk-cube4 spinnerx"></div>
      <div class="sk-cube sk-cube5 spinnerx"></div>
      <div class="sk-cube sk-cube6 spinnerx"></div>
      <div class="sk-cube sk-cube7 spinnerx"></div>
      <div class="sk-cube sk-cube8 spinnerx"></div>
      <div class="sk-cube sk-cube9 spinnerx"></div>
    </div>
    }
    @case (Spinkit.skFoldingCube) {
    <div class="sk-folding-cube center">
      <div class="sk-cube1 sk-cube"></div>
      <div class="sk-cube2 sk-cube"></div>
      <div class="sk-cube4 sk-cube"></div>
      <div class="sk-cube3 sk-cube"></div>
    </div>
    }
    @case (Spinkit.skWave) {
    <div class="spinner center">
      <div class="rect1"></div>
      <div class="rect2"></div>
      <div class="rect3"></div>
      <div class="rect4"></div>
      <div class="rect5"></div>
    </div>
    }
    @case (Spinkit.skSpinningSquare) {
      <div class="spinner center"></div>
    }
    }
  </div>
</div>
}
